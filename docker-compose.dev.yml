# Development override for local development (BASE_DOMAIN=localhost). Used automatically via
# COMPOSE_FILE in the .env created by `scripts/gen-env.sh --dev`. Never use it in production.
services:
  garage:
    ports:
      - "127.0.0.1:3900:3900" # direct S3 API, for debugging
      - "127.0.0.1:3903:3903" # admin API, for a control-plane running on the host

  control:
    # Always build locally, and never overwrite the release image tag.
    image: storage-edge-control:dev
    pull_policy: build
    ports:
      - "127.0.0.1:8080:8080" # for `npm run dev` in web/ (proxies /api)
    environment:
      # Refused by the control-plane if EDGE_HOSTNAME is not .localhost/.test.
      DNS_VERIFY: "off"
      COOKIE_SECURE: "false"
      DNS_SERVER: ""

  caddy:
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro

  # Tool: docker compose run --rm awscli s3 ls
  awscli:
    image: amazon/aws-cli:2.37.10
    profiles: ["tools"]
    environment:
      AWS_ENDPOINT_URL: http://garage:3900
      AWS_DEFAULT_REGION: garage
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./sample:/sample:ro
