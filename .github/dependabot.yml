# Dependency updates are kept as quiet as possible: once a month, one PR per ecosystem
# (all updates grouped), so at most 5 PRs per month.
#
# Security vulnerabilities are still detected sooner through:
#   - govulncheck and npm audit in CI (also run on a weekly schedule, see ci.yml)
#   - "Dependabot security updates" in Settings → Advanced Security (does not need this file)
version: 2

updates:
  - package-ecosystem: gomod
    directory: /control
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      tooling:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  # Dockerfile (node, golang) and docker-compose (caddy, busybox, aws-cli) are grouped per file.
  - package-ecosystem: docker
    directory: /control
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      docker-compose:
        patterns: ["*"]
    ignore:
      # Upgrading Garage touches data (metadata, block format), so it is done deliberately:
      # back up first, read the Garage release notes, then bump the version by hand.
      - dependency-name: dxflrs/garage

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
