version: 2

updates:
  - package-ecosystem: gomod
    directory: /control
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      # Minor/patch digabung jadi satu PR; major tetap terpisah karena bisa breaking.
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /control
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
