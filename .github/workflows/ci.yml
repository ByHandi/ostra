name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dipanggil release.yml supaya image hanya dirilis dari commit yang lolos CI.
  workflow_call:
  # Tiap Senin pagi (WIB): menangkap celah keamanan yang baru diumumkan di dependency
  # (govulncheck, npm audit) walaupun tidak ada commit baru.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "File belum di-gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - name: npm audit (dependency yang ikut ke bundle)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Versi di-pin (sama dengan yang dipakai lokal di CONTRIBUTING.md), karena shellcheck
      # bawaan runner bisa berbeda versi dan hasilnya.
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 scripts/*.sh

  docker:
    name: Docker image & compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validasi docker-compose (production dan dev)
        run: |
          cp .env.example .env
          sed -i -e 's/^BASE_DOMAIN=$/BASE_DOMAIN=example.com/' \
                 -e 's/^ACME_EMAIL=$/ACME_EMAIL=ops@example.com/' \
                 -e 's/^\(GARAGE_[A-Z_]*\|CONTROL_JWT_SECRET\)=$/\1=ci/' .env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build (amd64 + arm64, tanpa push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: control/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
