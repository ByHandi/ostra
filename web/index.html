<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the app draw under the notch; safe-area insets pad it back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFCFE" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS home-screen app: full screen, content under a translucent status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ostra" />
    <title>Ostra</title>
    <!-- Blocking on purpose: applies the theme before the first paint. External so the
         Content-Security-Policy can forbid inline scripts. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
