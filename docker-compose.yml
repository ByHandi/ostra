# Konfigurasi production. Semua yang khusus development ada di docker-compose.dev.yml
# (dipakai otomatis kalau .env dibuat dengan `scripts/gen-env.sh --dev`).
name: storage-edge

services:
  # Membuat garage.toml dari template dengan BASE_DOMAIN, lalu selesai.
  garage-config:
    image: busybox:1.37.0
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?isi BASE_DOMAIN di .env, mis. domainku.com}
    volumes:
      - ./garage/garage.toml.tmpl:/template/garage.toml.tmpl:ro
      - garage-config:/config
    command:
      - sh
      - -c
      - |
        case "$$BASE_DOMAIN" in
          *[!a-z0-9.-]*) echo "BASE_DOMAIN tidak valid: $$BASE_DOMAIN" >&2; exit 1 ;;
        esac
        sed "s/__BASE_DOMAIN__/$$BASE_DOMAIN/g" /template/garage.toml.tmpl > /config/garage.toml

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    # --single-node: layout cluster dibuat otomatis saat pertama jalan.
    command: ["/garage", "server", "--single-node"]
    depends_on:
      garage-config:
        condition: service_completed_successfully
    environment:
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?jalankan scripts/gen-env.sh dulu}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?jalankan scripts/gen-env.sh dulu}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?jalankan scripts/gen-env.sh dulu}
    volumes:
      - garage-config:/etc/garage:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  control:
    # Image rilis dari GitHub Actions. Pin versi lewat CONTROL_IMAGE di .env, mis.
    # ghcr.io/byhandi/storage-edge:0.1.0. `docker compose up -d --build` membangun dari source.
    image: ${CONTROL_IMAGE:-ghcr.io/byhandi/storage-edge:latest}
    build:
      context: .
      dockerfile: control/Dockerfile
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      INTERNAL_LISTEN_ADDR: ":9000"
      DB_PATH: /data/control.db
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?jalankan scripts/gen-env.sh dulu}
      CONTROL_JWT_SECRET: ${CONTROL_JWT_SECRET:?jalankan scripts/gen-env.sh dulu}
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:-edge.${BASE_DOMAIN}}
      WEB_ROOT_DOMAIN: .web.${BASE_DOMAIN}
      RESERVED_DOMAINS: ${RESERVED_DOMAINS:-s3.${BASE_DOMAIN},console.${BASE_DOMAIN}}
      DNS_SERVER: ${DNS_SERVER:-1.1.1.1:53}
      # Kosong = loopback + jaringan privat (Caddy bawaan). Isi kalau ada proxy lain di depan Caddy.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - control-data:/data
    healthcheck:
      # Image scratch tidak punya curl; binary-nya sendiri yang memanggil /healthz.
      test: ["CMD", "/control", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_healthy
      control:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?isi ACME_EMAIL di .env (dipakai Let's Encrypt)}
      CONSOLE_DOMAIN: console.${BASE_DOMAIN}
      S3_DOMAIN: s3.${BASE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

volumes:
  garage-config:
  garage-meta:
  garage-data:
  control-data:
  caddy-data:
  caddy-config:
