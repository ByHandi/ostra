name: storage-edge

services:
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?jalankan scripts/gen-env.sh dulu}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?jalankan scripts/gen-env.sh dulu}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?jalankan scripts/gen-env.sh dulu}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900" # S3 API langsung, untuk debug
      - "127.0.0.1:3903:3903" # admin API, untuk control-plane yang dijalankan di host

  control:
    build:
      context: .
      dockerfile: control/Dockerfile
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "127.0.0.1:8080:8080" # untuk `npm run dev` di web/ (proxy /api)
    environment:
      LISTEN_ADDR: ":8080"
      INTERNAL_LISTEN_ADDR: ":9000"
      DB_PATH: /data/control.db
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?jalankan scripts/gen-env.sh dulu}
      CONTROL_JWT_SECRET: ${CONTROL_JWT_SECRET:?jalankan scripts/gen-env.sh dulu}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:-edge.localhost}
      WEB_ROOT_DOMAIN: ${WEB_ROOT_DOMAIN:-.web.localhost}
      RESERVED_DOMAINS: ${RESERVED_DOMAINS:-s3.localhost,console.localhost}
      DNS_VERIFY: ${DNS_VERIFY:-on}
      DNS_SERVER: ${DNS_SERVER:-}
    volumes:
      - control-data:/data

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - garage
      - control
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      S3_DOMAIN: ${S3_DOMAIN:-}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/${CADDYFILE:-Caddyfile.dev}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Tool: docker compose run --rm awscli s3 ls
  awscli:
    image: amazon/aws-cli:2.37.10
    profiles: ["tools"]
    environment:
      AWS_ENDPOINT_URL: http://garage:3900
      AWS_DEFAULT_REGION: garage
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./sample:/sample:ro

volumes:
  control-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
